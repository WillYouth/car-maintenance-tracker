# /etc/nginx/sites-available/car-tracker  ->  symlink into sites-enabled/
# Lives inside Nginx's http{} context, so the limit_req_zone below is valid here.

limit_req_zone $binary_remote_addr zone=login:1m rate=6r/m;

# --- HTTP: ACME challenges + redirect everything else to HTTPS -------------
server {
    listen 80;
    listen [::]:80;
    server_name cars.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: TLS termination, static files, reverse proxy to Node -----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cars.example.com;

    # Certificates from certbot (see README). Camera access on phones requires a
    # trusted HTTPS origin, so these must be valid for the phone's browser.
    ssl_certificate     /etc/letsencrypt/live/cars.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cars.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # Photos are compressed client-side to ~1024px; invoices up to ~1600px.
    client_max_body_size 6m;
    client_body_timeout 30s;
    keepalive_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/calendar;

    # Static SPA assets served by Nginx itself: Node never touches them.
    root /opt/car-tracker/public;
    index index.html;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/car-tracker-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/car-tracker-proxy.conf;
    }

    location /calendar/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/car-tracker-proxy.conf;
        proxy_cache_valid 200 15m;
    }

    location / {
        try_files $uri /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    access_log /var/log/nginx/car-tracker.access.log;
    error_log  /var/log/nginx/car-tracker.error.log warn;
}

